# Human vs AI Configuration
# Play snake yourself against an AI opponent

game:
  width: 30
  height: 30
  cell_size: 20
  fps: 10
  background_color: [20, 20, 20]   # dark gray
  grid_color: [100, 100, 100]      # gray

snakes:
  - name: "Human Player"
    start_position: [5, 15]
    color: [255, 215, 0]            # gold
    controller:
      type: "human"
  
  - name: "AI Opponent"
    start_position: [25, 15]
    color: [255, 0, 0]              # red
    controller:
      type: "algorithmic"
      algorithm: "astar"
      heuristic: "euclidean"
      max_steps: 500
